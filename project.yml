# XcodeGen project definition — the source of truth for the Xcode project.
# Regenerate the .xcodeproj after editing this file with:  xcodegen generate
name: PhotoEditor
options:
  bundleIdPrefix: com.photoeditor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MTL_COMPILER_FLAGS: "-fcikernel"
    MTLLINKER_FLAGS: "-cikernel"

targets:
  PhotoEditor:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: PhotoEditor
        PRODUCT_BUNDLE_IDENTIFIER: com.photoeditor.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PhotoEditor
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  PhotoEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        # Fixture READMEs/manifests aren't bundle resources — tests locate
        # them on disk via #filePath, relative to the source tree. Letting
        # xcodegen glob them into the target's Resources phase causes
        # filename collisions once more than one fixture dir has a
        # README.md (flattened Resources copy has no subdirectories), and
        # would make the generated project depend on whichever personal
        # fixture files (RAW samples, parity TIFFs) happen to be present
        # locally when `xcodegen generate` runs.
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: PhotoEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photoeditor.tests
        GENERATE_INFOPLIST_FILE: YES
